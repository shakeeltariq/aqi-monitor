; AQI Monitor for Waveshare ESP32-S3-Touch-LCD-1.28
; Build:   pio run
; Flash:   pio run -t upload          (USB-C; hold BOOT + tap RESET if upload fails)
; Monitor: pio device monitor
; OTA:     pio run -e ota -t upload   (after first USB flash; device must be on your LAN)

[platformio]
default_envs = waveshare_s3_round

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R2: 16 MB external flash, 2 MB quad-SPI PSRAM
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 160000000L
board_upload.maximum_size = 16777216
board_build.psram_type = qio

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0      ; board uses a CH343P USB-UART bridge, not native USB
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=1
    ; Optional: skip the setup hotspot by baking in your WiFi (2.4 GHz only).
    ; Uncomment both lines. Used only on first boot / after a WiFi reset.
    -DWIFI_SSID=\"StormFiber-0BA0\"
    -DWIFI_PASS=\"mTAHa4M4\"

[env:waveshare_s3_round]

[env:ota]
upload_protocol = espota
upload_port = aqi-monitor.local
